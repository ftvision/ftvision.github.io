<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 434" role="img" aria-labelledby="orchestration-title orchestration-desc">
  <title id="orchestration-title">Where the loop runs, and what the transcript records</title>
  <desc id="orchestration-desc">With discrete tool use the model sits inside the loop and its context grows with each iteration. With Claude Science the model emits two code cells and the loop runs inside the kernel.</desc>
  <style>
    svg{--exec:var(--color-data-1,#2563eb);--evidence:var(--color-data-1,#2563eb);--packet:var(--color-action-primary,#2563eb);--muted:var(--color-border-strong,#9ca3af);--text:var(--color-text-primary,#111827);--subtext:var(--color-text-secondary,#4b5563);--quiet:var(--color-text-muted,#6b7280);--page:var(--color-bg-primary,#fff);--border:var(--color-border,#d1d5db);--soft-border:var(--color-border-muted,#d1d5db);font-family:var(--font-sans,system-ui,sans-serif)}.exec-fill{fill:color-mix(in srgb,var(--exec) 14%,var(--page))}.scenario-crispr{display:none}.cs-svg-host[data-scenario="crispr"] .scenario-lit{display:none}.cs-svg-host[data-scenario="crispr"] .scenario-crispr{display:inline}.packet{display:none}@keyframes orchestration-bounce{0%{offset-distance:0;opacity:0}8%{opacity:1}92%{opacity:1}100%{offset-distance:100%;opacity:0}}@keyframes orchestration-orbit{from{offset-distance:0}to{offset-distance:100%}}.cs-svg-host[data-running="true"] .packet{display:block}.bounce{animation:orchestration-bounce 1.7s linear infinite}.orbit{animation:orchestration-orbit 1s linear infinite}.progress-clip{height:var(--progress-height,80px)}@media(prefers-reduced-motion:reduce){.packet{display:none!important}}
  </style>
  <defs>
    <marker id="orchestration-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="var(--exec)" stroke-width="1.6"/>
    </marker>
    <clipPath id="orchestration-progress-clip">
      <rect class="progress-clip" x="98" y="330" width="244" height="72"/>
    </clipPath>
  </defs>
  <text x="20" y="22" font-size="13" font-weight="600" fill="var(--text)">Discrete tool use</text>
  <text x="20" y="38" font-size="10.5" fill="var(--quiet)">the model sits inside the loop</text>
  <rect x="80" y="56" width="150" height="40" rx="8" fill="var(--text)"/>
  <text x="155" y="81" text-anchor="middle" font-size="12.5" font-weight="600" fill="var(--page)">Model</text>
  <rect class="exec-fill" x="80" y="168" width="150" height="40" rx="8" stroke="var(--exec)"/>
  <text class="scenario-lit" x="155" y="193" text-anchor="middle" font-size="12" font-weight="600" font-family="var(--font-code,monospace)" fill="var(--text)">host.llm()</text>
  <text class="scenario-crispr" x="155" y="193" text-anchor="middle" font-size="12" font-weight="600" font-family="var(--font-code,monospace)" fill="var(--text)">host.mcp()</text>
  <path d="M138 96L138 168" fill="none" stroke="var(--exec)" stroke-width="1.6" marker-end="url(#orchestration-arrow)"/>
  <path d="M172 168L172 96" fill="none" stroke="var(--exec)" stroke-width="1.6" marker-end="url(#orchestration-arrow)"/>
  <text x="120" y="136" text-anchor="end" font-size="9.5" fill="var(--subtext)">call</text>
  <text x="190" y="136" font-size="9.5" fill="var(--subtext)">result</text>
  <text class="scenario-lit" x="155" y="236" text-anchor="middle" font-size="11" font-weight="600" fill="var(--evidence)">repeat &#xD7;240</text>
  <text class="scenario-crispr" x="155" y="236" text-anchor="middle" font-size="11" font-weight="600" fill="var(--evidence)">repeat &#xD7; N genes</text>
  <text x="155" y="251" text-anchor="middle" font-size="9.5" fill="var(--quiet)">every call + result passes through the model</text>
  <circle class="packet bounce" r="5" fill="var(--packet)" style="offset-path:path('M138 96 L138 168 L172 168 L172 96')"/>
  <line x1="360" y1="14" x2="360" y2="262" stroke="var(--border)"/>
  <text x="384" y="22" font-size="13" font-weight="600" fill="var(--text)">Claude Science &#x2014; code in the kernel</text>
  <text x="384" y="38" font-size="10.5" fill="var(--quiet)">the loop runs off-model</text>
  <rect x="440" y="56" width="150" height="40" rx="8" fill="var(--text)"/>
  <text x="515" y="81" text-anchor="middle" font-size="12.5" font-weight="600" fill="var(--page)">Model</text>
  <rect class="exec-fill" x="400" y="150" width="270" height="104" rx="8" stroke="var(--exec)"/>
  <text class="scenario-lit" x="416" y="166" font-size="10" fill="var(--quiet)">PERSISTENT PYTHON KERNEL</text>
  <text class="scenario-crispr" x="416" y="166" font-size="10" fill="var(--quiet)">CONTROL REPL KERNEL</text>
  <path d="M430 172 H640 A12 12 0 0 1 652 184 V218 A12 12 0 0 1 640 230 H430 A12 12 0 0 1 418 218 V184 A12 12 0 0 1 430 172 Z" fill="none" stroke="var(--exec)" stroke-opacity=".45" stroke-width="1.3" stroke-dasharray="5 4"/>
  <rect x="430" y="182" width="210" height="38" rx="8" fill="var(--page)" stroke="var(--soft-border)"/>
  <text class="scenario-lit" x="535" y="205" text-anchor="middle" font-size="11" font-family="var(--font-code,monospace)" fill="var(--text)">host.llm(prompt)</text>
  <text class="scenario-crispr" x="535" y="205" text-anchor="middle" font-size="9.5" font-family="var(--font-code,monospace)" fill="var(--text)">host.mcp("bio", "civic_search_genes", &#x2026;)</text>
  <text class="scenario-lit" x="535" y="245" text-anchor="middle" font-size="9.5" font-weight="600" fill="var(--evidence)">repeats &#xD7;240</text>
  <text class="scenario-crispr" x="535" y="245" text-anchor="middle" font-size="9.5" font-weight="600" fill="var(--evidence)">repeats &#xD7; N genes</text>
  <circle class="packet orbit" r="5" fill="var(--packet)" style="offset-path:path('M430 172 H640 A12 12 0 0 1 652 184 V218 A12 12 0 0 1 640 230 H430 A12 12 0 0 1 418 218 V184 A12 12 0 0 1 430 172 Z')"/>
  <path d="M488 96L488 150" fill="none" stroke="var(--exec)" stroke-width="1.6" marker-end="url(#orchestration-arrow)"/>
  <path d="M542 150L542 96" fill="none" stroke="var(--exec)" stroke-width="1.6" marker-end="url(#orchestration-arrow)"/>
  <text x="480" y="128" text-anchor="end" font-size="9.5" fill="var(--subtext)">2 code cells</text>
  <text x="550" y="128" font-size="9.5" fill="var(--subtext)">2 results</text>
  <line x1="20" y1="288" x2="700" y2="288" stroke="var(--border)"/>
  <text x="20" y="310" font-size="11" font-weight="600" fill="var(--quiet)">MODEL CONTEXT WINDOW</text>
  <text x="20" y="336" font-size="11.5" font-weight="600" fill="var(--text)">Discrete</text>
  <rect x="90" y="322" width="260" height="94" rx="5" fill="var(--page)" stroke="var(--border)"/>
  <g clip-path="url(#orchestration-progress-clip)">
    <g fill="var(--exec)" opacity=".85">
      <rect x="98" y="330" width="244" height="4" rx="1"/>
      <rect x="98" y="339" width="244" height="4" rx="1"/>
      <rect x="98" y="348" width="244" height="4" rx="1"/>
      <rect x="98" y="357" width="244" height="4" rx="1"/>
      <rect x="98" y="366" width="244" height="4" rx="1"/>
      <rect x="98" y="375" width="244" height="4" rx="1"/>
      <rect x="98" y="384" width="244" height="4" rx="1"/>
      <rect x="98" y="393" width="244" height="4" rx="1"/>
    </g>
    <g fill="var(--muted)">
      <rect x="98" y="334" width="244" height="4" rx="1"/>
      <rect x="98" y="343" width="244" height="4" rx="1"/>
      <rect x="98" y="352" width="244" height="4" rx="1"/>
      <rect x="98" y="361" width="244" height="4" rx="1"/>
      <rect x="98" y="370" width="244" height="4" rx="1"/>
      <rect x="98" y="379" width="244" height="4" rx="1"/>
      <rect x="98" y="388" width="244" height="4" rx="1"/>
      <rect x="98" y="397" width="244" height="4" rx="1"/>
    </g>
  </g>
  <text class="scenario-lit" x="342" y="410" text-anchor="end" font-size="9" fill="var(--evidence)">grows with N &#x2014; &#xD7;240 &#x2026;</text>
  <text class="scenario-crispr" x="342" y="410" text-anchor="end" font-size="9" fill="var(--evidence)">grows with N &#x2014; &#xD7; N genes &#x2026;</text>
  <text x="384" y="336" font-size="11.5" font-weight="600" fill="var(--text)">Claude Science</text>
  <rect x="480" y="322" width="220" height="94" rx="5" fill="var(--page)" stroke="var(--border)"/>
  <rect class="exec-fill" x="490" y="332" width="200" height="16" rx="3" stroke="var(--exec)"/>
  <text x="500" y="344" font-size="9" font-family="var(--font-code,monospace)" fill="var(--exec)">python &#xB7; cell 1</text>
  <rect class="exec-fill" x="490" y="352" width="200" height="16" rx="3" stroke="var(--exec)"/>
  <text x="500" y="364" font-size="9" font-family="var(--font-code,monospace)" fill="var(--exec)">python &#xB7; cell 2</text>
  <text x="690" y="410" text-anchor="end" font-size="9" fill="var(--exec)">stays flat &#x2014; 2 tool calls</text>
</svg>
