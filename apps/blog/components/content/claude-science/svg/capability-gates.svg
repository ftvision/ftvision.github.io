<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 462" role="img" aria-labelledby="capability-gates-title capability-gates-desc">
  <title id="capability-gates-title">Two gates decide which kernel calls reach the daemon</title>
  <desc id="capability-gates-desc">Four calls from the selected kernel pass through a kernel SDK surface gate and a daemon permit set gate. Each is marked admitted, blocked in the kernel, or blocked at the daemon.</desc>
  <style>
    svg{--allow:var(--color-status-success,#15803d);--deny:var(--color-status-danger,#b91c1c);--reached:var(--color-data-1,#2563eb);--idle:var(--color-border-muted,#d1d5db);--text:var(--color-text-primary,#111827);--subtext:var(--color-text-secondary,#4b5563);--muted:var(--color-text-muted,#6b7280);--page:var(--color-bg-primary,#fff);--panel:var(--color-bg-secondary,#f3f4f6);--code:var(--color-surface-code,#f8fafc);--border:var(--color-border-default,#d1d5db);--strong:var(--color-border-strong,#9ca3af);font-family:var(--font-sans,system-ui,sans-serif)}.kernel-control,.kernel-reviewer{display:none}.cs-svg-host[data-kernel="control"] .kernel-analysis,.cs-svg-host[data-kernel="reviewer"] .kernel-analysis{display:none}.cs-svg-host[data-kernel="control"] .kernel-control,.cs-svg-host[data-kernel="reviewer"] .kernel-reviewer{display:inline}.lane{transition:stroke .2s,opacity .2s}
  </style>
  <defs>
    <marker id="capability-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--muted)"/>
    </marker>
    <g id="capability-pass">
      <circle r="11" fill="var(--page)"/>
      <path d="M-5 0l3.4 3.6L5.6-5" fill="none" stroke="var(--allow)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="capability-stop-observed">
      <circle r="11" fill="var(--page)"/>
      <path d="M-5-5L5 5M5-5L-5 5" fill="none" stroke="var(--deny)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="10" cy="-10" r="2.6" fill="var(--muted)"/>
    </g>
    <g id="capability-stop-source">
      <circle r="11" fill="var(--page)"/>
      <path d="M-5-5L5 5M5-5L-5 5" fill="none" stroke="var(--deny)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="10" cy="-10" r="3" fill="none" stroke="var(--muted)" stroke-width="1.2"/>
    </g>
  </defs>
  <text x="372" y="58" text-anchor="middle" fill="var(--muted)" font-size="12">GATE 1</text>
  <text x="372" y="82" text-anchor="middle" fill="var(--text)" font-size="16" font-weight="600">kernel SDK surface</text>
  <text x="372" y="102" text-anchor="middle" fill="var(--muted)" font-size="11">ergonomic, bypassable</text>
  <text x="628" y="58" text-anchor="middle" fill="var(--muted)" font-size="12">GATE 2</text>
  <text x="628" y="82" text-anchor="middle" fill="var(--text)" font-size="16" font-weight="600">daemon permit set</text>
  <text x="628" y="102" text-anchor="middle" fill="var(--muted)" font-size="11">the real boundary</text>
  <line x1="372" y1="128" x2="372" y2="410" stroke="var(--strong)" stroke-dasharray="5 4"/>
  <line x1="625" y1="122" x2="625" y2="416" stroke="var(--strong)" stroke-width="1.2"/>
  <line x1="631" y1="122" x2="631" y2="416" stroke="var(--strong)" stroke-width="1.2"/>
  <g id="capability-call-labels">
    <g>
      <rect x="24" y="146" width="232" height="44" rx="4" fill="var(--code)" stroke="var(--border)"/>
      <text x="40" y="173" fill="var(--text)" font-size="13" font-family="var(--font-code,monospace)">host.artifacts(...)</text>
    </g>
    <g>
      <rect x="24" y="214" width="232" height="44" rx="4" fill="var(--code)" stroke="var(--border)"/>
      <text x="40" y="241" fill="var(--text)" font-size="13" font-family="var(--font-code,monospace)">host.llm(...)</text>
    </g>
    <g>
      <rect x="24" y="282" width="232" height="44" rx="4" fill="var(--code)" stroke="var(--border)"/>
      <text x="40" y="309" fill="var(--text)" font-size="13" font-family="var(--font-code,monospace)">host.mcp(...)</text>
    </g>
    <g>
      <rect x="24" y="350" width="232" height="44" rx="4" fill="var(--code)" stroke="var(--border)"/>
      <text x="40" y="369" fill="var(--text)" font-size="13" font-family="var(--font-code,monospace)">_host_call("mcp", ...)</text>
      <text x="40" y="386" fill="var(--muted)" font-size="10.5">raw transport, always loaded</text>
    </g>
  </g>
  <g class="kernel-analysis">
    <g>
      <path class="lane" d="M256 168H628H712" fill="none" stroke="var(--reached)" stroke-width="2" marker-end="url(#capability-arrow)"/>
      <use href="#capability-pass" transform="translate(372 168)"/>
      <use href="#capability-pass" transform="translate(628 168)"/>
      <rect x="712" y="144" width="224" height="48" rx="4" fill="var(--panel)" stroke="var(--idle)"/>
      <rect x="712" y="144" width="4" height="48" fill="var(--allow)"/>
      <text x="728" y="164" fill="var(--text)" font-size="13" font-weight="600">admitted</text>
      <text x="728" y="181" fill="var(--muted)" font-size="10.5">admitted, then logged</text>
    </g>
    <g>
      <path class="lane" d="M256 236H628H712" fill="none" stroke="var(--reached)" stroke-width="2" marker-end="url(#capability-arrow)"/>
      <use href="#capability-pass" transform="translate(372 236)"/>
      <use href="#capability-pass" transform="translate(628 236)"/>
      <rect x="712" y="212" width="224" height="48" rx="4" fill="var(--panel)" stroke="var(--idle)"/>
      <rect x="712" y="212" width="4" height="48" fill="var(--allow)"/>
      <text x="728" y="232" fill="var(--text)" font-size="13" font-weight="600">admitted</text>
      <text x="728" y="249" fill="var(--muted)" font-size="10.5">admitted, then logged</text>
    </g>
    <g>
      <path d="M256 304H372" stroke="var(--reached)" stroke-width="2"/>
      <path d="M372 304H628" stroke="var(--idle)" stroke-width="2" stroke-dasharray="3 5" opacity=".5"/>
      <path d="M372 304H712" stroke="var(--idle)" stroke-width="1.5" stroke-dasharray="1.5 4" opacity=".6"/>
      <use href="#capability-stop-observed" transform="translate(372 304)"/>
      <rect x="712" y="280" width="224" height="48" rx="4" fill="var(--panel)" stroke="var(--idle)"/>
      <rect x="712" y="280" width="4" height="48" fill="var(--deny)"/>
      <text x="728" y="300" fill="var(--text)" font-size="13" font-weight="600">blocked in kernel</text>
      <text x="728" y="317" fill="var(--muted)" font-size="10.5">not injected in the kernel</text>
    </g>
    <g>
      <path d="M256 372H628" stroke="var(--reached)" stroke-width="2"/>
      <path d="M628 372H712" stroke="var(--idle)" stroke-width="1.5" stroke-dasharray="1.5 4" opacity=".6"/>
      <use href="#capability-pass" transform="translate(372 372)"/>
      <use href="#capability-stop-source" transform="translate(628 372)"/>
      <rect x="712" y="348" width="224" height="48" rx="4" fill="var(--panel)" stroke="var(--idle)"/>
      <rect x="712" y="348" width="4" height="48" fill="var(--deny)"/>
      <text x="728" y="368" fill="var(--text)" font-size="13" font-weight="600">blocked at daemon</text>
      <text x="728" y="385" fill="var(--muted)" font-size="10.5">daemon permit set refuses it</text>
    </g>
  </g>
  <g class="kernel-control">
    <g>
      <path d="M256 168H628H712" fill="none" stroke="var(--reached)" stroke-width="2" marker-end="url(#capability-arrow)"/>
      <use href="#capability-pass" transform="translate(372 168)"/>
      <use href="#capability-pass" transform="translate(628 168)"/>
      <rect x="712" y="144" width="224" height="48" rx="4" fill="var(--panel)" stroke="var(--idle)"/>
      <rect x="712" y="144" width="4" height="48" fill="var(--allow)"/>
      <text x="728" y="164" fill="var(--text)" font-size="13" font-weight="600">admitted</text>
      <text x="728" y="181" fill="var(--muted)" font-size="10.5">admitted, then logged</text>
    </g>
    <g>
      <path d="M256 236H628H712" fill="none" stroke="var(--reached)" stroke-width="2" marker-end="url(#capability-arrow)"/>
      <use href="#capability-pass" transform="translate(372 236)"/>
      <use href="#capability-pass" transform="translate(628 236)"/>
      <rect x="712" y="212" width="224" height="48" rx="4" fill="var(--panel)" stroke="var(--idle)"/>
      <rect x="712" y="212" width="4" height="48" fill="var(--allow)"/>
      <text x="728" y="232" fill="var(--text)" font-size="13" font-weight="600">admitted</text>
      <text x="728" y="249" fill="var(--muted)" font-size="10.5">admitted, then logged</text>
    </g>
    <g>
      <path d="M256 304H628H712" fill="none" stroke="var(--reached)" stroke-width="2" marker-end="url(#capability-arrow)"/>
      <use href="#capability-pass" transform="translate(372 304)"/>
      <use href="#capability-pass" transform="translate(628 304)"/>
      <rect x="712" y="280" width="224" height="48" rx="4" fill="var(--panel)" stroke="var(--idle)"/>
      <rect x="712" y="280" width="4" height="48" fill="var(--allow)"/>
      <text x="728" y="300" fill="var(--text)" font-size="13" font-weight="600">admitted</text>
      <text x="728" y="317" fill="var(--muted)" font-size="10.5">admitted, then logged</text>
    </g>
    <g>
      <path d="M256 372H628H712" fill="none" stroke="var(--reached)" stroke-width="2" marker-end="url(#capability-arrow)"/>
      <use href="#capability-pass" transform="translate(372 372)"/>
      <use href="#capability-pass" transform="translate(628 372)"/>
      <rect x="712" y="348" width="224" height="48" rx="4" fill="var(--panel)" stroke="var(--idle)"/>
      <rect x="712" y="348" width="4" height="48" fill="var(--allow)"/>
      <text x="728" y="368" fill="var(--text)" font-size="13" font-weight="600">admitted</text>
      <text x="728" y="385" fill="var(--muted)" font-size="10.5">mcp is allowed here</text>
    </g>
  </g>
  <g class="kernel-reviewer">
    <g>
      <path d="M256 168H628H712" fill="none" stroke="var(--reached)" stroke-width="2" marker-end="url(#capability-arrow)"/>
      <use href="#capability-pass" transform="translate(372 168)"/>
      <use href="#capability-pass" transform="translate(628 168)"/>
      <rect x="712" y="144" width="224" height="48" rx="4" fill="var(--panel)" stroke="var(--idle)"/>
      <rect x="712" y="144" width="4" height="48" fill="var(--allow)"/>
      <text x="728" y="164" fill="var(--text)" font-size="13" font-weight="600">admitted</text>
      <text x="728" y="181" fill="var(--muted)" font-size="10.5">admitted, read-only</text>
    </g>
    <g>
      <path d="M256 236H628" stroke="var(--reached)" stroke-width="2"/>
      <path d="M628 236H712" stroke="var(--idle)" stroke-width="1.5" stroke-dasharray="1.5 4"/>
      <use href="#capability-pass" transform="translate(372 236)"/>
      <use href="#capability-stop-source" transform="translate(628 236)"/>
      <rect x="712" y="212" width="224" height="48" rx="4" fill="var(--panel)" stroke="var(--idle)"/>
      <rect x="712" y="212" width="4" height="48" fill="var(--deny)"/>
      <text x="728" y="232" fill="var(--text)" font-size="13" font-weight="600">blocked at daemon</text>
      <text x="728" y="249" fill="var(--muted)" font-size="10.5">daemon read-only set excludes it</text>
    </g>
    <g>
      <path d="M256 304H628" stroke="var(--reached)" stroke-width="2"/>
      <path d="M628 304H712" stroke="var(--idle)" stroke-width="1.5" stroke-dasharray="1.5 4"/>
      <use href="#capability-pass" transform="translate(372 304)"/>
      <use href="#capability-stop-source" transform="translate(628 304)"/>
      <rect x="712" y="280" width="224" height="48" rx="4" fill="var(--panel)" stroke="var(--idle)"/>
      <rect x="712" y="280" width="4" height="48" fill="var(--deny)"/>
      <text x="728" y="300" fill="var(--text)" font-size="13" font-weight="600">blocked at daemon</text>
      <text x="728" y="317" fill="var(--muted)" font-size="10.5">daemon read-only set excludes it</text>
    </g>
    <g>
      <path d="M256 372H628" stroke="var(--reached)" stroke-width="2"/>
      <path d="M628 372H712" stroke="var(--idle)" stroke-width="1.5" stroke-dasharray="1.5 4"/>
      <use href="#capability-pass" transform="translate(372 372)"/>
      <use href="#capability-stop-source" transform="translate(628 372)"/>
      <rect x="712" y="348" width="224" height="48" rx="4" fill="var(--panel)" stroke="var(--idle)"/>
      <rect x="712" y="348" width="4" height="48" fill="var(--deny)"/>
      <text x="728" y="368" fill="var(--text)" font-size="13" font-weight="600">blocked at daemon</text>
      <text x="728" y="385" fill="var(--muted)" font-size="10.5">daemon read-only set excludes it</text>
    </g>
  </g>
  <line x1="24" y1="436" x2="52" y2="436" stroke="var(--allow)" stroke-width="2" marker-end="url(#capability-arrow)"/>
  <text x="60" y="440" fill="var(--subtext)" font-size="11">admitted</text>
  <circle cx="176" cy="436" r="2.6" fill="var(--muted)"/>
  <text x="186" y="440" fill="var(--subtext)" font-size="11">block observed locally</text>
  <circle cx="358" cy="436" r="3" fill="none" stroke="var(--muted)" stroke-width="1.2"/>
  <text x="368" y="440" fill="var(--subtext)" font-size="11">block read from daemon source, not run</text>
</svg>
