<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 244" role="img" aria-labelledby="prov-conf-title">
  <title id="prov-conf-title">A four-tier evidence ladder: runtime observation drawn solid is most direct, then recorded evidence, then reconstruction drawn dashed, then pending extraction drawn dotted.</title>
  <style>
    svg {
      --evidence: var(--color-data-1, #2563eb);
      --text: var(--color-text-primary, #111827);
      --subtext: var(--color-text-secondary, #4b5563);
      --muted: var(--color-text-muted, #6b7280);
      --page: var(--color-bg-primary, #fff);
      font-family: var(--font-sans, system-ui, sans-serif);
    }
    .observed { fill: color-mix(in srgb, var(--evidence) 14%, var(--page)); stroke: var(--evidence); stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="prov-conf-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="var(--muted)" stroke-width="1.6"/>
    </marker>
  </defs>
  <path d="M18 20 L18 196" fill="none" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#prov-conf-arrow)"/>
  <text x="12" y="108" font-size="10" fill="var(--muted)" text-anchor="middle" letter-spacing=".5" transform="rotate(-90 12 108)">directness</text>
  <rect class="observed" x="44" y="12" width="668" height="40" rx="8"/>
  <text x="60" y="30" font-size="12.5" font-weight="600" fill="var(--text)">Observed at runtime</text>
  <text x="60" y="45" font-size="10.5" fill="var(--subtext)">tags survive read &#x2192; write</text>
  <text x="696" y="36" font-size="10" font-weight="600" fill="var(--evidence)" text-anchor="end">direct</text>
  <rect x="44" y="60" width="668" height="40" rx="8" fill="none" stroke="var(--evidence)" stroke-width="1.5"/>
  <text x="60" y="78" font-size="12.5" font-weight="600" fill="var(--text)">Recorded</text>
  <text x="60" y="93" font-size="10.5" fill="var(--subtext)">reads &#xB7; writes &#xB7; executions &#xB7; host calls</text>
  <rect x="44" y="108" width="668" height="40" rx="8" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="60" y="126" font-size="12.5" font-weight="600" fill="var(--subtext)">Reconstructed &#xB7; fallback</text>
  <text x="60" y="141" font-size="10.5" fill="var(--muted)">post-hoc dependency mapping, extracted code</text>
  <rect x="44" y="156" width="668" height="40" rx="8" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="1.5 4" opacity=".75"/>
  <text x="60" y="174" font-size="12.5" font-weight="600" fill="var(--muted)">Pending</text>
  <text x="60" y="189" font-size="10.5" fill="var(--muted)">convergence unfinished</text>
  <line x1="44" y1="224" x2="80" y2="224" stroke="var(--evidence)" stroke-width="1.6"/>
  <text x="88" y="228" font-size="10.5" fill="var(--subtext)">observed</text>
  <line x1="190" y1="224" x2="226" y2="224" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="234" y="228" font-size="10.5" fill="var(--subtext)">reconstructed</text>
  <line x1="352" y1="224" x2="388" y2="224" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="1.5 4"/>
  <text x="396" y="228" font-size="10.5" fill="var(--subtext)">pending</text>
</svg>
