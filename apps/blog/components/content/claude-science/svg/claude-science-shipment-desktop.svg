<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" role="img" aria-labelledby="shipment-desktop-title shipment-desktop-desc">
  <title id="shipment-desktop-title">Unpacking the Claude Science 0.1.15 installation</title>
  <desc id="shipment-desktop-desc">The signed app ships a seed daemon. It stages a self-updating daemon, which selects a versioned runtime, which provisions the larger Python, R, and MCP execution environments.</desc>
  <style>
    svg {
      --product: var(--color-data-1, #2563eb);
      --provisioned: var(--color-border-strong, #9ca3af);
      --text: var(--color-text-primary, #111827);
      --subtext: var(--color-text-secondary, #4b5563);
      --muted: var(--color-text-muted, #6b7280);
      --panel: var(--color-bg-secondary, #f3f4f6);
      font-family: var(--font-sans, system-ui, sans-serif);
    }
    .code { font-family: var(--font-family-code, monospace); }
    .layer { transition: opacity 360ms ease-out, transform 360ms cubic-bezier(.22,1,.36,1); transform-box: fill-box; transform-origin: center; }
    .cs-svg-host[data-revealed="1"] .stage-2,
    .cs-svg-host[data-revealed="1"] .stage-3,
    .cs-svg-host[data-revealed="1"] .stage-4,
    .cs-svg-host[data-revealed="2"] .stage-3,
    .cs-svg-host[data-revealed="2"] .stage-4,
    .cs-svg-host[data-revealed="3"] .stage-4 { opacity: 0; transform: translateX(-18px); }
    .station { fill: var(--panel); stroke: var(--product); stroke-width: 1.4; }
    .provisioned-station { fill: var(--provisioned); fill-opacity: .08; stroke: var(--provisioned); stroke-width: 1.4; }
    .divider { stroke: var(--product); stroke-opacity: .35; }
    .bullet { fill: var(--muted); }
    @media (prefers-reduced-motion: reduce) { .layer { transition: none; } }
  </style>
  <defs>
    <marker id="shipment-desktop-arrow" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1L7 4L0 7Z" fill="var(--provisioned)"/>
    </marker>
  </defs>
  <text x="16" y="24" fill="var(--muted)" class="code" font-size="11">UNPACKED INSTALLATION &#xB7; DARWIN-ARM64</text>
  <text x="984" y="24" text-anchor="end" fill="var(--muted)" font-size="11">dashed = reconstructed staging &#xB7; box size not to scale</text>
  <g class="layer stage-2" aria-hidden="true">
    <path d="M146 100V66H246V100" fill="none" stroke="var(--provisioned)" stroke-width="1.4" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shipment-desktop-arrow)"/>
    <text x="196" y="59" text-anchor="middle" fill="var(--subtext)" class="code" font-size="10">stages</text>
  </g>
  <g class="layer stage-3" aria-hidden="true">
    <path d="M384 100V66H484V100" fill="none" stroke="var(--provisioned)" stroke-width="1.4" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shipment-desktop-arrow)"/>
    <text x="434" y="59" text-anchor="middle" fill="var(--subtext)" class="code" font-size="10">selects</text>
  </g>
  <g class="layer stage-4" aria-hidden="true">
    <path d="M672 100V66H778V100" fill="none" stroke="var(--provisioned)" stroke-width="1.4" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shipment-desktop-arrow)"/>
    <text x="725" y="59" text-anchor="middle" fill="var(--subtext)" class="code" font-size="10">provisions</text>
  </g>
  <g class="layer stage-1">
    <rect class="station" x="16" y="100" width="150" height="62" rx="2"/>
    <text x="28" y="122" fill="var(--text)" font-size="13" font-weight="600">Signed app</text>
    <text x="155" y="122" text-anchor="end" fill="var(--product)" class="code" font-size="11" font-weight="600">111 MB</text>
    <text x="28" y="139" fill="var(--muted)" class="code" font-size="9">/Applications</text>
  </g>
  <g class="layer stage-2">
    <rect class="station" x="226" y="100" width="178" height="156" rx="2"/>
    <path class="divider" d="M226 146H404"/>
    <text x="238" y="122" fill="var(--text)" font-size="13" font-weight="600">Staged daemon</text>
    <text x="393" y="122" text-anchor="end" fill="var(--product)" class="code" font-size="11" font-weight="600">&#x2248;112 MB</text>
    <text x="238" y="139" fill="var(--muted)" class="code" font-size="9">~/.claude-science/bin</text>
    <g aria-hidden="true" fill="var(--subtext)" class="code" font-size="9.5">
      <circle class="bullet" cx="242" cy="167" r="1.4"/>
      <text x="249" y="170">host &#xB7; dispatcher</text>
      <circle class="bullet" cx="242" cy="189" r="1.4"/>
      <text x="249" y="192">web service</text>
      <circle class="bullet" cx="242" cy="211" r="1.4"/>
      <text x="249" y="214">SDK templates &#xD7;21</text>
      <circle class="bullet" cx="242" cy="233" r="1.4"/>
      <text x="249" y="236">kernel manager</text>
    </g>
  </g>
  <g class="layer stage-3">
    <rect class="station" x="464" y="100" width="228" height="210" rx="2"/>
    <path class="divider" d="M464 146H692"/>
    <text x="476" y="122" fill="var(--text)" font-size="13" font-weight="600">Versioned runtime</text>
    <text x="681" y="122" text-anchor="end" fill="var(--product)" class="code" font-size="11" font-weight="600">&#x2248;95 MB</text>
    <text x="476" y="139" fill="var(--muted)" class="code" font-size="9">~/.claude-science/runtime</text>
    <g aria-hidden="true" fill="var(--subtext)" class="code" font-size="9.5">
      <circle class="bullet" cx="480" cy="167" r="1.4"/>
      <text x="487" y="170">agents</text>
      <circle class="bullet" cx="480" cy="188" r="1.4"/>
      <text x="487" y="191">kernels</text>
      <circle class="bullet" cx="480" cy="209" r="1.4"/>
      <text x="487" y="212">compute</text>
      <circle class="bullet" cx="480" cy="230" r="1.4"/>
      <text x="487" y="233">skills</text>
      <circle class="bullet" cx="480" cy="251" r="1.4"/>
      <text x="487" y="254">mcp-servers</text>
      <circle class="bullet" cx="592" cy="167" r="1.4"/>
      <text x="599" y="170">drizzle/sqlite</text>
      <circle class="bullet" cx="592" cy="188" r="1.4"/>
      <text x="599" y="191">seed</text>
      <circle class="bullet" cx="592" cy="209" r="1.4"/>
      <text x="599" y="212">web-dist</text>
      <circle class="bullet" cx="592" cy="230" r="1.4"/>
      <text x="599" y="233">support bins</text>
    </g>
  </g>
  <g class="layer stage-4">
    <rect class="provisioned-station" x="758" y="100" width="226" height="252" rx="2"/>
    <path d="M758 146H984" stroke="var(--provisioned)" stroke-opacity=".35"/>
    <text x="770" y="122" fill="var(--text)" font-size="13" font-weight="600">Environments</text>
    <text x="973" y="122" text-anchor="end" fill="var(--provisioned)" class="code" font-size="11" font-weight="600">&#x2248;3.7 GB</text>
    <text x="770" y="139" fill="var(--muted)" class="code" font-size="9">~/.claude-science/conda</text>
    <g aria-hidden="true" fill="var(--subtext)" class="code" font-size="9.5">
      <circle class="bullet" cx="774" cy="167" r="1.4"/>
      <text x="781" y="170">python env</text>
      <circle class="bullet" cx="774" cy="189" r="1.4"/>
      <text x="781" y="192">r env</text>
      <circle class="bullet" cx="774" cy="211" r="1.4"/>
      <text x="781" y="214">operon-mcp</text>
    </g>
    <text x="772" y="302" fill="var(--provisioned)" font-size="30" font-weight="600">&#x2248;95%</text>
    <text x="772" y="324" fill="var(--subtext)" class="code" font-size="10">of the ~3.9 GB app home</text>
  </g>
</svg>
