<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 800" role="img" aria-labelledby="cs-arch-mobile-title cs-arch-mobile-desc">
  <title id="cs-arch-mobile-title">Daemon-centered Claude Science architecture</title>
  <desc id="cs-arch-mobile-desc">A mobile layout of the Claude Science architecture. Every worker and durable record connects separately to the daemon authority spine.</desc>
  <style>
    svg {
      --cs-exec: var(--color-data-1, #2563eb);
      --cs-super: var(--color-text-secondary, #4b5563);
      --cs-evidence: var(--color-data-1, #2563eb);
      --cs-neutral: var(--color-text-muted, #6b7280);
      --cs-query: var(--color-action-primary, #2563eb);
      --cs-text: var(--color-text-primary, #111827);
      --cs-subtext: var(--color-text-secondary, #4b5563);
      --cs-page: var(--color-bg-primary, #ffffff);
      --cs-panel: var(--color-bg-secondary, #f3f4f6);
      --cs-code: var(--color-surface-code, #f8fafc);
      --cs-border: var(--color-border, #d1d5db);
      --cs-strong-border: var(--color-border-strong, #9ca3af);
      font-family: var(--font-sans, system-ui, sans-serif);
    }

    .node { transition: stroke 160ms ease, stroke-width 160ms ease; }
    .execution-node { fill: var(--cs-panel); stroke: var(--cs-exec); stroke-width: 1.4; }
    .evidence-node { fill: var(--cs-panel); stroke: var(--cs-evidence); stroke-width: 1.4; }
    .query-packet { opacity: 0; }

    .cs-svg-host[data-active="daemon"] #cs-arch-m-node-daemon,
    .cs-svg-host[data-active="repl"] #cs-arch-m-node-repl,
    .cs-svg-host[data-active="handoff"] #cs-arch-m-node-handoff,
    .cs-svg-host[data-active="python"] #cs-arch-m-node-python,
    .cs-svg-host[data-active="mcp"] #cs-arch-m-node-mcp,
    .cs-svg-host[data-active="artifact"] #cs-arch-m-node-artifact,
    .cs-svg-host[data-active="reviewer"] #cs-arch-m-node-reviewer {
      stroke: var(--cs-query);
      stroke-width: 3;
    }

    @keyframes cs-arch-query { from { offset-distance: 0%; } to { offset-distance: 100%; } }
    .cs-svg-host[data-playing="true"][data-hop="0"] #cs-arch-m-packet-0,
    .cs-svg-host[data-playing="true"][data-hop="1"] #cs-arch-m-packet-1,
    .cs-svg-host[data-playing="true"][data-hop="2"] #cs-arch-m-packet-2,
    .cs-svg-host[data-playing="true"][data-hop="3"] #cs-arch-m-packet-3,
    .cs-svg-host[data-playing="true"][data-hop="4"] #cs-arch-m-packet-4,
    .cs-svg-host[data-playing="true"][data-hop="5"] #cs-arch-m-packet-5,
    .cs-svg-host[data-playing="true"][data-hop="6"] #cs-arch-m-packet-6,
    .cs-svg-host[data-playing="true"][data-hop="7"] #cs-arch-m-packet-7 {
      opacity: 1;
      animation: cs-arch-query 700ms linear both;
    }

    @media (prefers-reduced-motion: reduce) {
      .node { transition: none; }
      .query-packet { display: none; }
    }
  </style>
  <defs>
    <marker id="cs-arch-m-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="var(--cs-neutral)" stroke-width="1.6"/>
    </marker>
  </defs>
  <line x1="64" y1="168" x2="64" y2="746" stroke="var(--cs-strong-border)" stroke-width="1.6"/>
  <g id="cs-arch-m-connectors" fill="none">
    <path d="M64 249 L100 249" stroke="var(--cs-exec)" stroke-width="1.6" marker-end="url(#cs-arch-m-arrow)" marker-start="url(#cs-arch-m-arrow)"/>
    <path d="M64 423 L100 423" stroke="var(--cs-exec)" stroke-width="1.6" marker-end="url(#cs-arch-m-arrow)" marker-start="url(#cs-arch-m-arrow)"/>
    <path d="M64 500 L100 500" stroke="var(--cs-exec)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#cs-arch-m-arrow)" marker-start="url(#cs-arch-m-arrow)"/>
    <path d="M64 583 L100 583" stroke="var(--cs-exec)" stroke-width="1.6" marker-end="url(#cs-arch-m-arrow)" marker-start="url(#cs-arch-m-arrow)"/>
    <path d="M64 664 L100 664" stroke="var(--cs-evidence)" stroke-width="1.6" marker-end="url(#cs-arch-m-arrow)" marker-start="url(#cs-arch-m-arrow)"/>
    <path d="M64 746 L100 746" stroke="var(--cs-super)" stroke-width="1.5" stroke-dasharray="1.5 4" marker-end="url(#cs-arch-m-arrow)"/>
    <path d="M210 274 L210 310" stroke="var(--cs-neutral)" stroke-width="1.5" marker-end="url(#cs-arch-m-arrow)"/>
    <path d="M210 354 L210 398" stroke="var(--cs-neutral)" stroke-width="1.5" marker-end="url(#cs-arch-m-arrow)"/>
    <path d="M180 50 L180 82" stroke="var(--cs-neutral)" stroke-width="1.5" marker-end="url(#cs-arch-m-arrow)"/>
  </g>
  <text x="222" y="296" font-size="9.5" fill="var(--cs-neutral)">write</text>
  <text x="222" y="380" font-size="9.5" fill="var(--cs-neutral)">read</text>
  <text x="150" y="742" font-size="9.5" fill="var(--cs-super)">on checkpoint</text>
  <text x="150" y="496" font-size="9.5" fill="var(--cs-neutral)">gated</text>
  <line x1="44" y1="190" x2="316" y2="190" stroke="var(--cs-strong-border)" stroke-dasharray="5 4"/>
  <text x="316" y="184" text-anchor="end" font-size="9.5" fill="var(--cs-neutral)">host-call boundary</text>
  <text x="100" y="210" font-size="10.5" font-weight="600" fill="var(--cs-neutral)">EXECUTION &#xB7; workers</text>
  <text x="100" y="624" font-size="10.5" font-weight="600" fill="var(--cs-neutral)">EVIDENCE &#xB7; records</text>
  <g id="cs-arch-m-user">
    <rect id="cs-arch-m-node-user" class="node" x="105" y="16" width="150" height="34" rx="8" fill="var(--cs-panel)" stroke="var(--cs-border)" stroke-width="1.4"/>
    <text x="180" y="38" text-anchor="middle" font-size="12" fill="var(--cs-text)">User &#xB7; local web UI</text>
  </g>
  <g id="cs-arch-m-daemon">
    <rect id="cs-arch-m-node-daemon" class="node" x="64" y="82" width="232" height="86" rx="10" fill="var(--cs-text)" stroke="none" stroke-width="0"/>
    <text x="180" y="114" text-anchor="middle" font-size="16" font-weight="600" fill="var(--cs-page)">Daemon</text>
    <text x="180" y="134" text-anchor="middle" font-size="10.5" fill="var(--cs-page)" opacity=".8">the authority</text>
    <text x="180" y="152" text-anchor="middle" font-size="10" fill="var(--cs-page)" opacity=".75">permits &#xB7; records &#xB7; review &#xB7; connectors</text>
  </g>
  <g id="cs-arch-m-repl">
    <rect id="cs-arch-m-node-repl" class="node execution-node" x="100" y="224" width="220" height="50" rx="8"/>
    <text x="210" y="247" text-anchor="middle" font-size="12.5" font-weight="600" fill="var(--cs-text)">repl &#x2014; control plane</text>
    <text x="210" y="263" text-anchor="middle" font-size="9.5" fill="var(--cs-subtext)">stdlib &#xB7; connectors, agents</text>
  </g>
  <g id="cs-arch-m-handoff">
    <rect id="cs-arch-m-node-handoff" class="node" x="130" y="310" width="160" height="44" rx="6" fill="var(--cs-code)" stroke="var(--cs-strong-border)" stroke-width="1"/>
    <text x="210" y="330" text-anchor="middle" font-size="11" font-weight="600" fill="var(--cs-text)" font-family="var(--font-code, monospace)">./handoff/*.json</text>
    <text x="210" y="344" text-anchor="middle" font-size="8.5" fill="var(--cs-neutral)">files, not memory</text>
  </g>
  <g id="cs-arch-m-python">
    <rect id="cs-arch-m-node-python" class="node execution-node" x="100" y="398" width="220" height="50" rx="8"/>
    <text x="210" y="421" text-anchor="middle" font-size="12.5" font-weight="600" fill="var(--cs-text)">Python / R kernels</text>
    <text x="210" y="437" text-anchor="middle" font-size="9.5" fill="var(--cs-subtext)">data plane &#xB7; persistent state</text>
  </g>
  <g id="cs-arch-m-compute">
    <rect x="100" y="478" width="220" height="44" rx="8" fill="var(--cs-page)" stroke="var(--cs-exec)" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="210" y="504" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--cs-text)">Compute provider &#xB7; gated</text>
  </g>
  <g id="cs-arch-m-mcp">
    <rect id="cs-arch-m-node-mcp" class="node" x="100" y="558" width="220" height="50" rx="8" fill="var(--cs-panel)" stroke="var(--cs-border)" stroke-width="1.4"/>
    <text x="210" y="581" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cs-text)">MCP &#xB7; connectors &#xB7; app tiles</text>
    <text x="210" y="597" text-anchor="middle" font-size="9.5" fill="var(--cs-subtext)">the external world</text>
  </g>
  <g id="cs-arch-m-artifact">
    <rect id="cs-arch-m-node-artifact" class="node evidence-node" x="100" y="638" width="220" height="52" rx="8"/>
    <text x="210" y="662" text-anchor="middle" font-size="12.5" font-weight="600" fill="var(--cs-text)">Artifact store</text>
    <text x="210" y="678" text-anchor="middle" font-size="9.5" fill="var(--cs-subtext)">versioned &#xB7; lineage observed first</text>
  </g>
  <g id="cs-arch-m-reviewer">
    <rect id="cs-arch-m-node-reviewer" class="node" x="100" y="720" width="220" height="52" rx="8" fill="var(--cs-panel)" stroke="var(--cs-super)" stroke-width="1.4"/>
    <text x="210" y="744" text-anchor="middle" font-size="12.5" font-weight="600" fill="var(--cs-text)">Reviewer</text>
    <text x="210" y="760" text-anchor="middle" font-size="9.5" fill="var(--cs-subtext)">background &#xB7; read-only</text>
  </g>
  <g id="cs-arch-m-query-packets" aria-hidden="true">
    <circle id="cs-arch-m-packet-0" class="query-packet" r="5.5" fill="var(--cs-query)" stroke="var(--cs-page)" stroke-width="1.5" style="offset-path:path('M180 50 L180 82');offset-rotate:0deg"/>
    <circle id="cs-arch-m-packet-1" class="query-packet" r="5.5" fill="var(--cs-query)" stroke="var(--cs-page)" stroke-width="1.5" style="offset-path:path('M64 168 L64 249 L100 249');offset-rotate:0deg"/>
    <circle id="cs-arch-m-packet-2" class="query-packet" r="5.5" fill="var(--cs-query)" stroke="var(--cs-page)" stroke-width="1.5" style="offset-path:path('M210 274 L210 310');offset-rotate:0deg"/>
    <circle id="cs-arch-m-packet-3" class="query-packet" r="5.5" fill="var(--cs-query)" stroke="var(--cs-page)" stroke-width="1.5" style="offset-path:path('M210 354 L210 398');offset-rotate:0deg"/>
    <circle id="cs-arch-m-packet-4" class="query-packet" r="5.5" fill="var(--cs-query)" stroke="var(--cs-page)" stroke-width="1.5" style="offset-path:path('M100 423 L64 423');offset-rotate:0deg"/>
    <circle id="cs-arch-m-packet-5" class="query-packet" r="5.5" fill="var(--cs-query)" stroke="var(--cs-page)" stroke-width="1.5" style="offset-path:path('M64 423 L64 583 L100 583');offset-rotate:0deg"/>
    <circle id="cs-arch-m-packet-6" class="query-packet" r="5.5" fill="var(--cs-query)" stroke="var(--cs-page)" stroke-width="1.5" style="offset-path:path('M100 583 L64 583 L64 664 L100 664');offset-rotate:0deg"/>
    <circle id="cs-arch-m-packet-7" class="query-packet" r="5.5" fill="var(--cs-query)" stroke="var(--cs-page)" stroke-width="1.5" style="offset-path:path('M100 664 L64 664 L64 746 L100 746');offset-rotate:0deg"/>
  </g>
</svg>
